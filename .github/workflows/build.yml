name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: redline-linux
          - os: macos-latest
            artifact: redline-macos
          - os: windows-latest
            artifact: redline-windows
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds for now (Tim's own machines). Remove to require signing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        # electron's postinstall downloads the platform binary; allowed on runners.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

      - name: Build installer
        run: npx electron-builder --publish never

      - name: Collect artifacts + update metadata
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.os }}" in
            ubuntu-latest)  cp dist/*.AppImage out/ 2>/dev/null || true ;;
            macos-latest)   cp dist/*.dmg out/ 2>/dev/null || true ;;
            windows-latest) cp dist/*.exe out/ 2>/dev/null || true ;;
          esac
          cp dist/latest*.yml out/ 2>/dev/null || true
          cp dist/*.blockmap out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release (installers + update metadata)
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
